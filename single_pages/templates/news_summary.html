<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팜트래커 - 약학 뉴스 요약</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #50C3E7;
            --secondary-color: #3aa0c9;
            --text-color: #333;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        .navbar {
            background-color: #fff;
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        .navbar-brand {
            font-weight: 700;
            color: var(--primary-color);
        }
        .content {
            margin-top: 80px;
            margin-bottom: 100px;
        }
        h1 {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
        }
        .article-summary {
            background-color: #fff;
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .article-summary h2 {
            color: var(--text-color);
        }
        .article-summary p {
            color: #555;
            line-height: 1.6;
        }
        .article-summary small {
            color: #888;
        }
        .tts-btn {
            margin-top: 20px;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        .tts-btn:hover {
            background-color: var(--secondary-color);
        }
        .camera-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: #fff;
            text-align: center;
            line-height: 70px;
            text-decoration: none;
            box-shadow: 0 2px 10px rgba(0,0,0,.2);
            transition: background-color 0.3s;
            font-size: 30px;
            z-index: 1000;
        }
        .camera-btn:hover {
            background-color: var(--secondary-color);
            color: #fff;
        }
        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #fff;
            box-shadow: 0 -2px 4px rgba(0,0,0,.1);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 999;
        }
        .footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">팜트래커</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'news' %}">약학뉴스</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'drug_list' %}">의약품 정보</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'chatbot' %}">챗봇</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        {% if user.is_authenticated %}
                            <a class="nav-link" href="{% url 'mypage' %}">{{ user.username }}님의 마이페이지</a>
                        {% else %}
                            <a class="nav-link" href="{% url 'login' %}">로그인</a>
                        {% endif %}
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container content">
        <h1>약학 뉴스 요약</h1>
        <div class="article-summary">
            <h2>{{ article.title }}</h2>
            <p><small>{{ article.date }} | {{ article.author }}</small></p>
            <p id="fullSummary">{{ article.full_summary }}</p>
            <a href="{{ article.link }}" class="btn btn-primary" target="_blank">전체 기사 읽기</a>
            <button class="tts-btn" onclick="readSummary()">요약 읽어주기</button>
        </div>
    </div>

    <a href="{% url 'ocr' %}" class="camera-btn" title="이미지로 약품 검색">
        <i class="fas fa-camera"></i>
    </a>

    <div class="footer">
        <a href="{% url 'home' %}"><i class="fas fa-home"></i></a>
        <a href="{% url 'mypage' %}"><i class="fas fa-user"></i></a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function readSummary() {
            const summary = document.getElementById('fullSummary').innerText;
            const utterance = new SpeechSynthesisUtterance(summary);
            utterance.lang = 'ko-KR';
            window.speechSynthesis.speak(utterance);
        }

        window.addEventListener('beforeunload', function() {
            window.speechSynthesis.cancel();
        });
    </script>
</body>
</html>
